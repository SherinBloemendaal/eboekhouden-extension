<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>EB Sessions</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="top">
  <img src="../../icons/icon-32.png" alt="" width="28" height="28">
  <span class="brand">EB Sessions</span>
  <span class="count" id="count"></span>
</header>
<main id="main">
  <h2 class="section">Administraties</h2>
  <div class="list" id="list"></div>
  <div id="confirm"></div>
  <button type="button" class="add" id="add">
    <span class="add-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    Administratie toevoegen
  </button>
  <h2 class="section settings-title">Instellingen</h2>
  <div class="settings" id="settings"></div>
</main>
<section id="picker" hidden>
  <h2 class="picker-title" id="picker-title"></h2>
  <p class="picker-text">De foto wordt vierkant bijgesneden tot 128 pixels en alleen in deze browser bewaard.</p>
  <label class="picker-button">Foto kiezen<input type="file" accept="image/*" id="picker-input"></label>
  <p class="picker-status" id="picker-status" role="status"></p>
</section>
<footer class="note">Wachtwoorden blijven in 1Password. Sessies staan alleen in het geheugen van Chrome.</footer>
<script src="../shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
